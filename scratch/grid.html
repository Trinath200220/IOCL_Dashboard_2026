<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; }
    .container { position: relative; width: 100%; display: inline-block; }
    img { width: 100%; display: block; }
    .grid-line-h { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,0,0,0.5); }
    .grid-line-v { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,0,0,0.5); }
    .label { position: absolute; color: red; font-size: 10px; background: white; padding: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="../src/assets/process flow.png" />
    <script>
      const container = document.querySelector('.container');
      for (let i = 0; i <= 100; i += 5) {
        // Horizontal lines
        let hLine = document.createElement('div');
        hLine.className = 'grid-line-h';
        hLine.style.top = i + '%';
        container.appendChild(hLine);
        
        let hLabel = document.createElement('div');
        hLabel.className = 'label';
        hLabel.style.top = i + '%';
        hLabel.style.left = '0';
        hLabel.innerText = i + '%';
        container.appendChild(hLabel);
        
        // Vertical lines
        let vLine = document.createElement('div');
        vLine.className = 'grid-line-v';
        vLine.style.left = i + '%';
        container.appendChild(vLine);
        
        let vLabel = document.createElement('div');
        vLabel.className = 'label';
        vLabel.style.left = i + '%';
        vLabel.style.top = '0';
        vLabel.innerText = i + '%';
        container.appendChild(vLabel);
      }
    </script>
  </div>
</body>
</html>
